<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題目一：計算機</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .calculator { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 10px; padding: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-num { background-color: #e0e0e0; }
        .btn-op { background-color: #ff9f43; color: white; }
        .btn-eq { background-color: #2ecc71; color: white; grid-column: span 2; }
        .btn-cls { background-color: #e74c3c; color: white; grid-column: span 2; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="btn-cls" onclick="clearDisplay()">C</button>
        <button class="btn-op" onclick="appendOp('/')">/</button>
        <button class="btn-op" onclick="appendOp('*')">×</button>
        
        <button class="btn-num" onclick="appendNum('7')">7</button>
        <button class="btn-num" onclick="appendNum('8')">8</button>
        <button class="btn-num" onclick="appendNum('9')">9</button>
        <button class="btn-op" onclick="appendOp('-')">-</button>
        
        <button class="btn-num" onclick="appendNum('4')">4</button>
        <button class="btn-num" onclick="appendNum('5')">5</button>
        <button class="btn-num" onclick="appendNum('6')">6</button>
        <button class="btn-op" onclick="appendOp('+')">+</button>
        
        <button class="btn-num" onclick="appendNum('1')">1</button>
        <button class="btn-num" onclick="appendNum('2')">2</button>
        <button class="btn-num" onclick="appendNum('3')">3</button>
        <button class="btn-eq" onclick="calculate()">=</button>
        
        <button class="btn-num" onclick="appendNum('0')">0</button>
        <button class="btn-num" onclick="appendNum('.')">.</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    
    function appendNum(num) {
        display.value += num;
    }
    
    function appendOp(op) {
        // 防止連續輸入運算符
        const lastChar = display.value.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar)) return;
        display.value += op;
    }
    
    function clearDisplay() {
        display.value = '';
    }
    
    function calculate() {
        try {
            // 使用 eval 計算結果 (題目為簡單計算機，eval 足夠應對)
            display.value = eval(display.value);
        } catch (e) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
